# Production deploy: GitHub main → tests → SSH deploy on EC2

name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  EC2_HOST: ${{ vars.EC2_HOST || '13.50.87.176' }}
  EC2_USER: ${{ vars.EC2_USER || 'ec2-user' }}
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/ec2-user/homeServicesBackend' }}
  RESTART_COMMAND: ${{ vars.RESTART_COMMAND || 'pm2 restart all' }}
  SITE_HOST: api.akanso.in
  HEALTH_URL: https://api.akanso.in/health

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${DEPLOY_PATH}"
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            npm ci --omit=dev
            ${RESTART_COMMAND}

      - name: Production health check
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            if curl -fsS "${HEALTH_URL}" | tee /tmp/health.json; then
              python3 -c 'import json,sys; d=json.load(open("/tmp/health.json")); assert d.get("success") is True'
              echo "Health check passed: ${HEALTH_URL}"
              exit 0
            fi
            echo "Health check attempt ${i} failed; retrying..."
            sleep 10
          done
          echo "Health check failed: ${HEALTH_URL}"
          exit 1

      - name: Deployment summary
        run: |
          echo "Host: ${EC2_HOST}"
          echo "Path: ${DEPLOY_PATH}"
          echo "Restart command: ${RESTART_COMMAND}"
          echo "Production: https://${SITE_HOST}"
