# Production deploy: GitHub main → tests → SSM deploy on EC2

name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: '24'
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-north-1' }}
  AWS_ROLE_ARN: ${{ vars.AWS_API_DEPLOY_ROLE_ARN || 'arn:aws:iam::715831355325:role/AkansoApiDeployRole' }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID || 'i-09f649d0d393471b6' }}
  DEPLOY_USER: ${{ vars.DEPLOY_USER || 'ubuntu' }}
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/var/www/homeservices-backend' }}
  RESTART_COMMAND: ${{ vars.RESTART_COMMAND || 'pm2 restart HomeServicesBackend' }}
  SITE_HOST: api.akanso.in
  HEALTH_URL: https://api.akanso.in/health

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: github-actions-akanso-api
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Apply S3 CORS for browser photo uploads
        env:
          AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET || 'akanso-assets' }}
        run: |
          set -euo pipefail
          aws s3api put-bucket-cors \
            --bucket "${AWS_S3_BUCKET}" \
            --cors-configuration file://ops/s3-bucket-cors.json
          aws s3api get-bucket-cors --bucket "${AWS_S3_BUCKET}"

      - name: Deploy to EC2 via SSM
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY' > /tmp/ssm-params.json
          import json, os
          remote_commands = [
            "set -euo pipefail",
            f"cd '{os.environ['DEPLOY_PATH']}'",
            "git fetch origin main",
            "git checkout main",
            "git reset --hard origin/main",
            "git clean -fd",
            "npm install --omit=dev",
            os.environ["RESTART_COMMAND"],
            "pm2 list",
          ]
          commands = [
            "set -euo pipefail",
            "sudo -iu {user} bash -lc {payload}".format(
              user=os.environ["DEPLOY_USER"],
              payload=json.dumps("; ".join(remote_commands)),
            ),
          ]
          print(json.dumps({"commands": commands}))
          PY

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "GitHub Actions backend deploy" \
            --parameters "file:///tmp/ssm-params.json" \
            --query "Command.CommandId" \
            --output text)"

          echo "SSM command id: ${COMMAND_ID}"
          STATUS="Pending"
          for _ in $(seq 1 60); do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")"
            case "${STATUS}" in
              Pending|InProgress|Delayed) sleep 2 ;;
              *) break ;;
            esac
          done

          echo "SSM status: ${STATUS}"
          echo "---- SSM stdout ----"
          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query "StandardOutputContent" \
            --output text || true

          if [ "${STATUS}" != "Success" ]; then
            echo "---- SSM stderr ----"
            aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query "StandardErrorContent" \
              --output text || true
            exit 1
          fi

      - name: Production health check
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            if curl -fsS "${HEALTH_URL}" | tee /tmp/health.json; then
              python3 -c 'import json,sys; d=json.load(open("/tmp/health.json")); assert d.get("success") is True'
              echo "Health check passed: ${HEALTH_URL}"
              exit 0
            fi
            echo "Health check attempt ${i} failed; retrying..."
            sleep 10
          done
          echo "Health check failed: ${HEALTH_URL}"
          exit 1

      - name: Deployment summary
        run: |
          echo "Instance: ${EC2_INSTANCE_ID}"
          echo "Deploy user: ${DEPLOY_USER}"
          echo "Path: ${DEPLOY_PATH}"
          echo "Restart command: ${RESTART_COMMAND}"
          echo "Production: https://${SITE_HOST}"
